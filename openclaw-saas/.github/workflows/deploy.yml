name: Deploy OpenClaw Backend to DigitalOcean

on:
  push:
    branches:
      - main # Trigger on push to main branch
    paths:
      - 'backend/**' # Only trigger when files under backend change
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Set Up Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log In to GitHub Container Registry (GHCR) ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract Metadata for Docker ──
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # ── Build and Push Docker Image ──
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SSH and Deploy to DigitalOcean Droplet ──
      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Navigate to application folder
            mkdir -p /opt/openclaw/backend
            cd /opt/openclaw/backend

            # Log into GHCR on the droplet
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull the new image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Update/Rewrite the docker-compose.yml configuration to target the new image
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              backend:
                image: ghcr.io/${{ env.IMAGE_NAME }}:latest
                container_name: openclaw-backend
                restart: always
                ports:
                  - "127.0.0.1:8000:8000"
                volumes:
                  - ./sessions:/app/app/whatsapp/sessions
                env_file:
                  - .env
            EOF

            # Restart containers with new image
            docker compose up -d

            # Clean up dangling images to prevent disk space saturation
            docker image prune -f
            docker logout ${{ env.REGISTRY }}

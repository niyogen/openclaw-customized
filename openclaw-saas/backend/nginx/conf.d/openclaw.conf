# ── HTTP → HTTPS redirect (both domains) ──────────────────────────
server {
    listen 80;
    server_name claw.niyogen.com openclaw.niyogen.com;

    # Allow certbot ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend: claw.niyogen.com → Next.js :3000 ────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name claw.niyogen.com;

    ssl_certificate     /etc/nginx/ssl/claw.niyogen.com.crt;
    ssl_certificate_key /etc/nginx/ssl/claw.niyogen.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend API: openclaw.niyogen.com → FastAPI :8000 ─────────────
server {
    listen 443 ssl;
    http2 on;
    server_name openclaw.niyogen.com;

    ssl_certificate     /etc/nginx/ssl/openclaw.niyogen.com.crt;
    ssl_certificate_key /etc/nginx/ssl/openclaw.niyogen.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openclaw-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ragdb
    ports:
      - "5434:5432"
    volumes:
      - backend_pgdata:/var/lib/postgresql/data

  backend:
    image: openclaw-backend:latest
    container_name: openclaw-backend
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./sessions:/app/app/whatsapp/sessions
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ragdb
    depends_on:
      - postgres

volumes:
  backend_pgdata:
    external: true
